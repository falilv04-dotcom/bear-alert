name: Check bear information (with Playwright)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bear-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries (pip)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright system deps and browsers
        run: |
          set -e

          # Update apt cache
          sudo apt-get update

          # Install common dependencies required by Chromium/Playwright
          # Use packages that provide libasound functionality on ubuntu-latest
          sudo apt-get install -y --no-install-recommends \
            ca-certificates \
            fonts-liberation \
            liboss4-salsa-asound2 \
            libasound2t64 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdbus-1-3 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libx11-xcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxrandr2 \
            libxss1 \
            libpangocairo-1.0-0 \
            libxkbcommon0 \
            wget

          # Optional fonts (helps rendering)
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji

          # Ensure pip packages are installed (playwright included)
          python -m pip install --upgrade pip
          pip install -r requirements.txt

          # Install Playwright browser binaries (Chromium)
          python -m playwright install chromium

      - name: Run check script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python src/check_bear.py

      - name: Upload debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug

      - name: Save notification state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/notified.json || true

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update notified bear information" || echo "Commit failed"
            git push || echo "Push failed"
          fi
