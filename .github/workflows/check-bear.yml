name: Check bear information (with Playwright)

on:
  schedule:
    # 毎時00分に実行（UTC）。日本時間で毎時00分にしたいならこのままでOK（cronはUTCだが毎時間の実行は差し支えなし）
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bear-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        # requirements.txt に playwright を入れておいてください（例: playwright==1.39.0）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        # Playwright のブラウザをインストールします。
        # --with-deps はランナーに必要な依存も合わせてインストールします（ubuntu-latest向け）。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run check script
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python src/check_bear.py

      - name: Upload debug HTML (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug

      - name: Save notification state
        if: success()
        run: |
          # Configure git user for the bot commit
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage the notified state file
          git add data/notified.json || true

          # If there are changes, commit and push
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update notified bear information" || echo "Commit failed"
            git push || echo "Push failed"
          fi
